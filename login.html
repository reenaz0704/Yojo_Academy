<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Sign up | Yojo Cyber Academy</title>
<meta name="description" content="Log in or create your Yojo Cyber Academy account. Students and employees (trainers and admins).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Theme tokens copied from index.html so both pages look the same */
:root{
  color-scheme: dark;
  --bg:#0A1220; --bg-deep:#070D18; --surface:#111C30; --surface-2:#16233B; --border:#22324D;
  --green:#39D98A; --blue:#3B82F6; --quantum:#5B8CFF; --amber:#FFB000; --red:#F87171;
  --text:#E6EDF7; --muted:#9AA9C2; --dim:#6B7C99; --off:#F87171; --def:#5B8CFF; --grc:#39D98A;
  --grad: linear-gradient(100deg, var(--green) 0%, #22C3B5 45%, var(--blue) 100%);
  --grad-soft: linear-gradient(135deg, rgba(57,217,138,.16), rgba(59,130,246,.16));
  --glass: rgba(17,28,48,.62);
  --glass-line: rgba(120,160,220,.16);
  --glow-g: 0 0 24px rgba(57,217,138,.35);
  --glow-b: 0 0 24px rgba(59,130,246,.4);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px; --r-sm: 9px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(900px 520px at 85% -10%, rgba(59,130,246,.18), transparent 60%),
   radial-gradient(800px 600px at -10% 30%, rgba(57,217,138,.10), transparent 60%),
   linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(120,160,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.07) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%)}
a{color:var(--green)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:700}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:600 .74rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--green);display:inline-flex;align-items:center;gap:.6em}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--grad);border-radius:2px}
.lead{color:var(--muted);font-size:1.02rem;max-width:56ch}
.note{color:var(--muted);font-size:.86rem}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{--h:46px;display:inline-flex;align-items:center;justify-content:center;gap:.55em;height:var(--h);padding:0 1.25rem;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:600 .95rem var(--f-display);text-decoration:none;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--quantum);box-shadow:var(--glow-b)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:var(--grad);color:#04121F;border:0}
.btn-primary:hover{box-shadow:0 0 0 1px rgba(57,217,138,.4),0 10px 34px rgba(57,217,138,.35)}
.btn-ghost{background:transparent;border-color:rgba(57,217,138,.45);color:var(--green)}
.btn-sm{--h:36px;padding:0 .95rem;font-size:.85rem}
.btn-block{width:100%}
.btn.google{width:100%;background:#fff;color:#1f2937;border:0}
.btn.google:hover{box-shadow:0 8px 24px rgba(255,255,255,.12)}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:disabled{color:var(--dim);cursor:not-allowed;text-decoration:none}

/* header */
header.site{position:sticky;top:0;z-index:20;background:rgba(10,18,32,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-line)}
header.site .wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:66px}
.logo{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:var(--text)}
.logo svg{width:40px;height:40px}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font:700 1.2rem var(--f-display);letter-spacing:.06em}
.logo .wm small{font:600 .6rem var(--f-mono);letter-spacing:.24em;color:var(--green);margin-top:.3em}
.hdr-right{display:flex;gap:.6rem;align-items:center}

/* layout */
main{max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,32px) 80px;display:grid;grid-template-columns:minmax(0,560px);justify-content:center;gap:clamp(24px,5vw,64px);align-items:start}
main.landing{grid-template-columns:1fr}
main.landing .intro{display:none}
main.landing .card{max-width:980px;width:100%;margin:0 auto}
.intro{display:grid;gap:1.4rem;padding-top:1rem}
.intro ul{list-style:none;padding:0;margin:0;display:grid;gap:.8rem}
.intro li{display:flex;gap:.8rem;align-items:flex-start;color:var(--muted)}
.intro li b{color:var(--text);display:block;font-family:var(--f-display)}
.intro .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--grad-soft);border:1px solid var(--glass-line);color:var(--green);flex:none}
.term{background:#050B15;border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;font:500 .8rem/1.7 var(--f-mono);color:var(--muted);box-shadow:inset 0 0 40px rgba(59,130,246,.06)}
.term .p{color:var(--green)} .term .k{color:var(--quantum)} .term .w{color:var(--amber)}
.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:20px;padding:clamp(20px,3.4vw,32px);box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative}
.card::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;background:linear-gradient(140deg,rgba(57,217,138,.5),transparent 35%,transparent 65%,rgba(59,130,246,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card-head{display:flex;gap:.8rem;align-items:center;margin-bottom:1.2rem}
.card-head svg{width:44px;height:44px;flex:none}

/* tabs */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--bg-deep);border:1px solid var(--border);margin-bottom:.8rem}
.seg button{height:40px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:600 .92rem var(--f-display);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--grad);color:#04121F}
.seg.sub{max-width:300px;margin:0 auto 1rem;background:transparent}
.seg.sub button{height:34px;font-size:.85rem}
.seg.sub button[aria-selected="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--quantum)}
.staff-banner{display:flex;gap:.6rem;align-items:center;justify-content:center;font:600 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:-.2rem 0 .9rem}

/* forms */
form{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.field{display:grid;gap:.35rem}
.field label,.lbl{font:600 .8rem var(--f-display);color:var(--muted);letter-spacing:.02em}
.field label .req{color:var(--red)}
input,select,textarea{width:100%;min-width:0;background:var(--bg-deep);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);padding:.72rem .85rem;font:400 .95rem var(--f-body);transition:border-color .2s, box-shadow .2s}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(57,217,138,.18)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--red)}
input[readonly]{opacity:.75}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.fieldset{min-width:0;border:1px solid var(--border);border-radius:var(--r);padding:1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.fieldset legend{font:600 .72rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green);padding:0 .4rem}
.consent{display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem;color:var(--muted);cursor:pointer}
.consent input{width:18px;height:18px;flex:none;margin-top:.15rem;accent-color:var(--green)}
.or{display:flex;align-items:center;gap:.8rem;font:600 .7rem var(--f-mono);letter-spacing:.16em;color:var(--dim)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.otp input{text-align:center;font:600 1.3rem var(--f-mono);padding:.65rem 0}
.otp-meta{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font:500 .8rem var(--f-mono);color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.choice button{text-align:left;padding:1rem;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:grid;gap:.25rem;transition:border-color .2s,box-shadow .2s,transform .2s}
.choice button:hover{transform:translateY(-2px);border-color:var(--quantum)}
.choice button[aria-pressed="true"]{border-color:var(--green);box-shadow:var(--glow-g)}
.choice b{font:700 1.2rem var(--f-display)}
.choice span{color:var(--muted);font-size:.84rem}
.alert{border-radius:var(--r-sm);padding:.7rem .9rem;font-size:.88rem;border:1px solid;display:flex;gap:.6rem;align-items:flex-start}
.alert.err{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08);color:#FCA5A5}
.alert.ok{border-color:rgba(57,217,138,.45);background:rgba(57,217,138,.08);color:#86EFAC}
.alert.info{border-color:rgba(91,140,255,.45);background:rgba(91,140,255,.08);color:#BFD1FF}
.alert.warn{border-color:rgba(255,176,0,.45);background:rgba(255,176,0,.08);color:#FFD27A}
.back{display:inline-flex;align-items:center;gap:.35rem;background:none;border:0;color:var(--muted);font:600 .82rem var(--f-display);cursor:pointer;padding:0;margin-bottom:.8rem}
.back:hover{color:var(--text)}
.steps{display:flex;gap:.4rem;margin-bottom:1rem}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--border)}
.steps i.on{background:var(--grad)}
.chip{display:inline-flex;align-items:center;gap:.4em;font:600 .7rem var(--f-mono);letter-spacing:.08em;padding:.3em .7em;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase}
.chip.g{color:var(--green);border-color:rgba(57,217,138,.45)} .chip.a{color:var(--amber);border-color:rgba(255,176,0,.45)} .chip.b{color:var(--quantum);border-color:rgba(91,140,255,.45)} .chip.r{color:var(--red);border-color:rgba(248,113,113,.45)}
.secret{font:600 1rem var(--f-mono);letter-spacing:.12em;background:var(--bg-deep);border:1px dashed var(--quantum);border-radius:var(--r-sm);padding:.7rem;text-align:center;word-break:break-all}

/* landing consoles */
.land-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:1.4rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
.tile{border:1px solid var(--border);border-radius:var(--r);padding:1rem;background:var(--surface);display:grid;gap:.4rem}
.tile.locked{opacity:.45}
.tile h3{font-size:.98rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.meters{display:grid;gap:.7rem}
.meter{display:grid;gap:.3rem}
.meter .bar{height:10px;border-radius:10px;background:var(--bg-deep);overflow:hidden;border:1px solid var(--border)}
.meter .bar i{display:block;height:100%;background:var(--grad)}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
table.tbl th,table.tbl td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--border)}
table.tbl th{color:var(--muted);font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}

/* google chooser + demo drawer */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,7,14,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.gbox{background:#fff;color:#1f2937;border-radius:16px;width:min(420px,100%);padding:1.4rem;display:grid;gap:.8rem;font-family:var(--f-body)}
.gbox h2{color:#111827;font-size:1.2rem}
.gbox .acc{display:flex;gap:.8rem;align-items:center;padding:.7rem;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.gbox .acc:hover{background:#f3f4f6}
.gbox .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e0e7ff;color:#3730a3;font-weight:700;flex:none}
.gbox small{color:#6b7280}
.gbox input{background:#fff;color:#111827;border-color:#d1d5db}
.demo-fab{position:fixed;left:16px;bottom:16px;z-index:50}
.demo{position:fixed;left:16px;bottom:68px;z-index:50;width:min(420px,calc(100vw - 32px));max-height:min(72vh,640px);overflow:auto;background:#0B1424;border:1px solid var(--quantum);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:1rem;display:grid;gap:1rem;font-size:.85rem}
.demo h3{font:600 .74rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.demo .acct{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.45rem 0;border-bottom:1px dashed var(--border)}
.demo .acct code{font:500 .78rem var(--f-mono);color:var(--text);word-break:break-all}
.demo .acct small{display:block;color:var(--muted)}
.mail{border:1px solid var(--border);border-radius:10px;padding:.6rem .7rem;background:var(--surface);display:grid;gap:.2rem}
.mail b.code{font:700 1.1rem var(--f-mono);color:var(--green);letter-spacing:.15em}
.totp-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px dashed var(--border)}
.totp-row b{font:700 1rem var(--f-mono);color:var(--quantum);letter-spacing:.12em}
.toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:grid;gap:.5rem}
.toast{background:var(--surface-2);border:1px solid var(--glass-line);border-left:3px solid var(--green);border-radius:10px;padding:.7rem 1rem;font-size:.88rem;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .3s var(--ease)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

@media (max-width:900px){ main{grid-template-columns:minmax(0,1fr)} .intro{order:2} }
.intro,.card{min-width:0}
@media (max-width:520px){ .grid2,.choice{grid-template-columns:minmax(0,1fr)} .hdr-right .btn-ghost span{display:none} .otp{gap:.3rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* popup (iframe) mode: the glass panel is drawn by index.html */
html.embed body{background:transparent;min-height:0}
html.embed body::before,html.embed body::after,html.embed header.site{display:none}
html.embed main{padding:0;max-width:none;grid-template-columns:minmax(0,1fr)}
html.embed .card{background:transparent;backdrop-filter:none;border:0;box-shadow:none;padding:clamp(18px,3vw,28px)}
html.embed .card::before{display:none}
html.embed .demo-fab{bottom:12px;left:12px}
html.embed #yojoConsent{display:none!important} /* the public page shows its own consent card; it must not cover the popup */

/* custom cursor: the same reticle as the public page, also inside the login / sign-up popup */
.cur-on, .cur-on *{cursor:none!important}
.cur-on input, .cur-on textarea{cursor:text!important}
.ycur{position:fixed;left:0;top:0;z-index:9999;pointer-events:none}
.ycur .dot{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#39D98A;box-shadow:0 0 10px #39D98A}
.ycur .ret{position:fixed;width:36px;height:36px;margin:-18px 0 0 -18px;transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),margin .25s cubic-bezier(.2,.8,.2,1)}
.ycur .ret svg{width:100%;height:100%;overflow:visible;animation:ycspin 6s linear infinite}
.ycur .ret svg *{stroke:#39D98A;fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
.ycur .lbl{position:fixed;font:700 .55rem "JetBrains Mono",monospace;letter-spacing:.16em;color:#FFB000;margin:22px 0 0 14px;opacity:0;transition:opacity .2s}
.ycur.lock .ret{width:54px;height:54px;margin:-27px 0 0 -27px}.ycur.lock .ret svg *{stroke:#FFB000}.ycur.lock .ret svg{animation-duration:1.4s}.ycur.lock .lbl{opacity:1}
.ycur.down .ret{width:26px;height:26px;margin:-13px 0 0 -13px}.ycur.hide{opacity:0}
@keyframes ycspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39D98A"/><stop offset=".5" stop-color="#22C3B5"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
  <symbol id="logo-mark" viewBox="0 0 64 64">
    <path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#0B1628" stroke="url(#lg)" stroke-width="3"/>
    <path d="M32 11l18 10.4v21.2L32 53 14 42.6V21.4z" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".45"/>
    <path d="M20 20l12 13 12-13" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 33v15" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2.6" fill="#FFB000"/><circle cx="44" cy="20" r="2.6" fill="#2EE6A6"/><circle cx="32" cy="48" r="2.6" fill="#4C7DFF"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 1V5a2 2 0 00-3-1zM15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
</svg>

<header class="site">
  <div class="wrap">

/* ---------- TOTP (RFC 6238, SHA-1, 30 s, 6 digits) ---------- */
function sha1(bytes) {
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6, m = new Uint8Array(total);
  m.set(bytes); m[len] = 0x80; const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (len * 8) >>> 0); dv.setUint32(total - 8, Math.floor(len * 8 / 2 ** 32));
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0; const w = new Uint32Array(80);
  for (let i = 0; i < total; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 80; t++) { const x = w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16]; w[t] = (x << 1) | (x >>> 31); }
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let t = 0; t < 80; t++) {
      let f, k;
      if (t < 20) { f = (b & c) | (~b & d); k = 0x5A827999; } else if (t < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (t < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; } else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const tmp = (((a << 5) | (a >>> 27)) + f + e + k + w[t]) >>> 0; e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = tmp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20), o = new DataView(out.buffer); [h0, h1, h2, h3, h4].forEach((h, i) => o.setUint32(i * 4, h)); return out;
}
function hmacSha1(key, msg) {
  if (key.length > 64) key = sha1(key);
  const k = new Uint8Array(64); k.set(key);
  const ip = new Uint8Array(64 + msg.length), op = new Uint8Array(84);
  for (let i = 0; i < 64; i++) { ip[i] = k[i] ^ 0x36; op[i] = k[i] ^ 0x5c; }
  ip.set(msg, 64); op.set(sha1(ip), 64); return sha1(op);
}
function b32decode(s) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; s = s.replace(/=+$/, '').replace(/\s/g, '').toUpperCase();
  let bits = 0, val = 0; const out = [];
  for (const ch of s) { const i = A.indexOf(ch); if (i < 0) continue; val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
function b32random(n = 16) { const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => A[x & 31]).join(''); }
function totp(secret, t = now()) {
  const c = Math.floor(t / 1000 / 30), msg = new Uint8Array(8), dv = new DataView(msg.buffer);
  dv.setUint32(0, Math.floor(c / 2 ** 32)); dv.setUint32(4, c >>> 0);
  const h = hmacSha1(b32decode(secret), msg), o = h[19] & 15;
  const code = (((h[o] & 0x7f) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % 1e6;
  return String(code).padStart(6, '0');
}
const totpOk = (secret, code) => [-1, 0, 1].some(s => totp(secret, now() + s * 30000) === String(code).trim());

const OTP = {
  rec: {},
  send(email, purpose) {

  verify(email, code) {
    const r = this.rec[email];
    if (!r) return { ok: false, msg: 'No active code. Request a new one.', dead: true };
    if (now() > r.exp) { delete this.rec[email]; return { ok: false, msg: 'This code has expired (5 minutes). Request a new one.', dead: true }; }
    if (r.code && code === r.code) { delete this.rec[email]; return { ok: true }; }
    r.tries--;

function validateField(f, v, p) {
  v = String(v || '').trim();
  if (f.req && !v) return `${f.l} is required.`;
  if (!v) return '';
  if (f.type === 'tel' && !/^[6-9]\d{9}$/.test(v.replace(/[\s+-]/g, '').replace(/^91(?=\d{10}$)/, ''))) return 'Enter a valid 10-digit Indian mobile number.';

  const out = {}, errs = [];
  list.forEach(f => { const el = form.elements[f.k]; if (!el) return; out[f.k] = el.value.trim(); });

}

const CAT = { O: 'Offensive', D: 'Defensive', G: 'GRC' };
const FIRST_MISSIONS = { Offensive: ['OFF-01 Recon Basics', 'OFF-02 Cookie Monster'], Defensive: ['DEF-01 SOC Day One', 'DEF-02 Log Detective'], GRC: ['GRC-01 Policy Primer', 'GRC-02 Asset Register'] };
// item score s and weights w per category for one answer; null when skipped
function itemScore(q, a) {
  if (a == null || a === 'skip') return null;
  if (q.scale) return Object.fromEntries(Object.entries(q.w).map(([c, w]) => [c, { w, s: (a - 1) / 4 }]));
  if (q.map) return Object.fromEntries(['O', 'D', 'G'].map(c => [c, { w: 1, s: q.map[a] === c ? 1 : .5 }]));
  if (q.forced) return Object.fromEntries(Object.entries(q.forced[a]).map(([c, s]) => [c, { w: 1, s }]));
  const s = a === q.key ? 1 : (q.part || []).includes(a) ? .5 : 0;
  return Object.fromEntries(Object.entries(q.w).map(([c, w]) => [c, { w, s }]));
}
function scoreQuiz(ans) {
  const num = { O: 0, D: 0, G: 0 }, den = { O: 0, D: 0, G: 0 }, cnt = { O: 0, D: 0, G: 0 }, puz = { O: [0, 0], D: [0, 0], G: [0, 0] };
  let answered = 0;
  QBANK.forEach((q, i) => { const r = itemScore(q, ans[i]); if (!r) return; answered++;
    Object.entries(r).forEach(([c, { w, s }]) => { if (!w) return; num[c] += w * s; den[c] += w; cnt[c]++; if (i < 7) { puz[c][0] += s; puz[c][1]++; } }); });
  const score = Object.fromEntries(['O', 'D', 'G'].map(c => [CAT[c], den[c] ? Math.round(100 * num[c] / den[c]) : 0]));
  const acc = c => puz[c][1] ? puz[c][0] / puz[c][1] : 0;
  const order = ['O', 'D', 'G'].sort((a, b) => { const d = score[CAT[b]] - score[CAT[a]]; return Math.abs(d) > 3 ? d : acc(b) - acc(a) || d; });
  const provisional = answered < 15 || Object.values(cnt).some(n => n < 3);
  const conf = v => v >= 70 ? 'High' : v >= 50 ? 'Medium' : 'Low';
  return { scores: score, primary: CAT[order[0]], secondary: CAT[order[1]], provisional, answered, confidence: conf(score[CAT[order[0]]]) };
}

      ${opts.map(k => `<button type="button" role="radio" data-a="${k}" aria-pressed="${a === k}" aria-checked="${a === k}">${q.scale ? `<b style="text-align:center">${k}</b>` : `<span style="color:var(--text);font-size:.95rem">${q.map ? String.fromCharCode(65 + k) + '. ' : ''}${esc(q.o[k])}</span>`}</button>`).join('')}
    </div>
    ${q.scale ? '<div class="otp-meta" style="margin-top:.3rem"><span>Not at all</span><span>Very much</span></div>' : ''}
    ${q.map ? '<p class="note" style="margin-top:.5rem">Choose the best first move. No option is "wrong".</p>' : ''}
    <div id="qErr" style="margin-top:.6rem"></div>
    <div style="display:flex;gap:.5rem;justify-content:space-between;margin-top:1rem;flex-wrap:wrap">
      <button class="btn btn-sm" type="button" id="qBack" ${i === 0 ? 'disabled' : ''}>Back</button>
      <button class="btn btn-sm btn-ghost" type="button" id="qSkip" ${left <= 0 || a === 'skip' ? 'disabled' : ''}>Skip (${left} left)</button>
      <button class="btn btn-sm btn-primary" type="button" id="qNext">${i === 17 ? 'See my result' : 'Next'}</button>
    </div>`;
  $$('[data-a]').forEach(b => b.addEventListener('click', () => {
    if (st.ans[i] === 'skip') st.skips--;
    st.ans[i] = +b.dataset.a; save();
    $$('[data-a]').forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.setAttribute('aria-checked', String(x === b)); });
    $('#qErr').innerHTML = ''; $('#qSkip').textContent = `Skip (${3 - st.skips} left)`;
  }));
  const go = d => { st.i = Math.max(0, Math.min(17, i + d)); save(); viewQuestion(u); };
  $('#qBack').addEventListener('click', () => go(-1));
  $('#qSkip').addEventListener('click', () => { if (st.skips >= 3) return; if (st.ans[i] !== 'skip') { st.skips++; st.ans[i] = 'skip'; } save(); i === 17 ? finishQuiz(u) : go(1); });
  $('#qNext').addEventListener('click', () => {
    if (st.ans[i] == null) { $('#qErr').innerHTML = alertBox('info', left > 0 ? 'Pick an answer, or use Skip.' : 'Pick an answer to continue. No skips left.'); return; }

function finishQuiz(u) {

  flow().innerHTML = `<div style="display:grid;gap:1rem;justify-items:center;padding:2rem 0"><svg style="width:56px;height:56px"><use href="#logo-mark"/></svg><p class="mono">Calculating your cyber profile...</p></div>`;
  const r = scoreQuiz(st.ans);
  u.category = r.primary; u.secondary = r.secondary; u.scores = r.scores; u.provisional = r.provisional; u.confidence = r.confidence;
  u.quizHistory = [...(u.quizHistory || []), { at: new Date(now()).toISOString(), ...r }]; u.quiz = null;

function staffAfterEmail(email, how) {
  const u = findUser(email), want = S.staff;

  if (u.status === 'suspended') { audit('blocked: suspended', email); return staffBlocked('This account is suspended. Access ended. Contact a Platform Admin.'); }

    if (findUser(em)) { $('#ctErr').innerHTML = alertBox('err', 'An account with this email already exists.'); return; }
    db.users.push({ email: em, role: 'trainer', name: n, capability: $('#ct-c').value, batches: $('#ct-b').value.trim(), status: 'invited', invitedAt: now(), mfaSecret: null, createdBy: u.email });
    save(); audit('trainer invited ' + em, u.email);
    sendMail(em, 'You are invited to the Yojo Trainer Console', 'Open login.html, choose Employee > Trainer and sign in with this email. Link valid 72 hours.');
    $('#ctErr').innerHTML = alertBox('ok', `Invite sent to ${esc(em)}.`); e.target.reset(); renderDemo();
  });
}

/* ---------- sessions ---------- */
function startSession(u) {
  session = { email: u.email, role: u.role, at: now() }; store.sset(SESSION_KEY, session);
  if (u.role === 'student') store.set('yojo_demo_shared_session', { email: u.email, at: now() }); lastActivity = now();
  toast(`Signed in as ${u.email}`);
  land();
}
function land() {
  const u = session && findUser(session.email);
  if (!u) { session = null; store.sset(SESSION_KEY, null); landingMode(false); return selectRole(S.role, S.staff); }
  if (u.role === 'student') return routeStudent(u, S.booting);
  if (u.role === 'trainer') return landTrainer(u);
  return new URLSearchParams(location.search).get('stay') ? landAdmin(u) : landAdminTab(u);
}
function logout(msg) {
  session = null; store.sset(SESSION_KEY, null); try { localStorage.removeItem('yojo_demo_shared_session'); } catch {} landingMode(false); $('#tabsWrap').hidden = false;
  selectRole(S.role, S.staff); if (msg) $('#flow').insertAdjacentHTML('afterbegin', alertBox('info', msg));
}
function bindLogout() { $$('[data-logout]', flow()).forEach(b => b.addEventListener('click', () => logout('You are logged out.'))); }
['click', 'keydown', 'mousemove', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastActivity = now(); }, { passive: true }));
// the 30-minute inactivity sign-out was removed for demos (owner, 30 Oct; OI-63)

/* ---------- simulated Google account chooser ---------- */
function googleChooser(kind, cb) {
  const accts = kind === 'staff'
    ? db.users.filter(u => u.role !== 'student').map(u => [u.email, u.name]).concat([['someone@gmail.demo', 'Personal account']])
    : db.users.filter(u => u.role === 'student').map(u => [u.email, u.profile.name || u.email]).concat([['new.learner@gmail.demo', 'New Learner']]);
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Choose a Google account');
  ov.innerHTML = `<div class="gbox"><div style="display:flex;gap:.6rem;align-items:center">${googleIcon()}<b>Sign in with Google</b>${CFG.DEMO ? '<span style="margin-left:auto;font-size:.7rem;color:#b45309;font-weight:700">DEMO</span>' : ''}</div>
    <h2>Choose an account</h2>
    <div style="display:grid;gap:.4rem;max-height:46vh;overflow:auto">${accts.map(([e, n]) => `<button class="acc" data-e="${esc(e)}" data-n="${esc(n)}"><span class="av">${esc(n[0] || '?')}</span><span><b>${esc(n)}</b><br><small>${esc(e)}</small></span></button>`).join('')}</div>
    <form id="gOther" style="display:flex;gap:.5rem"><input type="email" placeholder="Use another account" aria-label="Use another Google account"><button class="btn btn-sm" type="submit" style="background:#1a73e8;color:#fff;border:0">Next</button></form>
    <button class="btn btn-sm" type="button" data-x style="background:#f3f4f6;color:#111827;border:0">Cancel</button></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $$('.acc', ov).forEach(b => b.addEventListener('click', () => { close(); cb(b.dataset.e, b.dataset.n); }));
  $('#gOther', ov).addEventListener('submit', e => { e.preventDefault(); const v = lc($('input', ov).value); if (!isEmail(v)) return; close(); cb(v, v.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase())); });
  $('[data-x]', ov).addEventListener('click', close);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('.acc', ov)?.focus();
}

/* ---------- demo helper panel ---------- */
function renderDemo() {
  if (!CFG.DEMO) return;
  const d = $('#demo'); if (d.hidden) return;
  const staff = db.users.filter(u => u.role !== 'student');
  const pend = S.ctx.pendingSecret;
  d.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>Demo accounts</h3><button class="btn btn-sm" id="dReset">Reset demo data</button></div>
    <div>${db.users.map(u => `<div class="acct"><span><code>${esc(u.email)}</code><small>${u.role === 'student' ? `Student · ${u.origin}${u.id ? ' · ' + u.id : ''} · ${missingFields(u.profile).length ? 'profile incomplete' : 'profile complete'} · ${u.category || 'no category'}` : u.role === 'admin' ? ADMIN_ROLES[u.adminRole] : `Trainer · ${u.status}`}</small></span><button class="btn btn-sm" data-use="${esc(u.email)}">Use</button></div>`).join('')}</div>
    <p class="note">Sign-up: any new email (e.g. <code>new.learner@gmail.demo</code>). Institution sign-up: <code>name@abc-institute.demo</code> with ABC Institute. No passwords: the spec uses email OTP, Google and an authenticator.</p>
    <div><h3>Inbox (OTP and emails)</h3><div style="display:grid;gap:.5rem;margin-top:.5rem" id="dMail">${mailbox.length ? mailbox.slice(0, 8).map(m => `<div class="mail"><small class="note">To ${esc(m.to)} · ${new Date(m.at).toLocaleTimeString()}</small><b>${esc(m.subject)}</b>${m.code ? `<b class="code" data-otp-for="${esc(m.to)}">${m.code}</b>` : ''}<small class="note">${esc(m.body)}</small></div>`).join('') : '<p class="note">No emails yet.</p>'}</div></div>
    <div><h3>Authenticator app</h3><div id="dTotp" style="margin-top:.4rem">${staff.filter(u => u.mfaSecret).map(u => `<div class="totp-row"><code class="note">${esc(u.email)}</code><b data-totp-for="${esc(u.email)}">${totp(u.mfaSecret)}</b></div>`).join('')}
      ${pend ? `<div class="totp-row"><code class="note">setup key in progress</code><b data-totp-for="pending">${totp(pend)}</b></div>` : ''}
      <p class="note" id="dTick"></p></div></div>`;
  $('#dReset').addEventListener('click', () => { db = seed(); save(); mailbox.length = 0; Object.keys(OTP.rec).forEach(k => delete OTP.rec[k]); logout('Demo data reset.'); renderDemo(); });
  $$('[data-use]', d).forEach(b => b.addEventListener('click', () => {
    const u = findUser(b.dataset.use); if (session) logout();
    if (u.role === 'student') { selectRole('student'); S.ctx.gate = u.origin === 'yojo' ? 'yes' : null; u.origin === 'yojo' ? viewStudentLogin('yojo') : viewStudentLogin('returning'); }
    else selectRole('employee', u.role);
    const inp = $('#sl-id') || $('#st-mail'); if (inp) { inp.value = u.email; inp.focus(); }
  }));
}
setInterval(() => { const t = $('#dTick'); if (t && !$('#demo').hidden) { const left = 30 - Math.floor(now() / 1000) % 30; t.textContent = `Codes refresh in ${left} s`; if (left === 30) renderDemo(); } }, 1000);
if (CFG.DEMO) {
  $('#demoFab').hidden = false;
  $('#demoFab').addEventListener('click', () => { const d = $('#demo'); d.hidden = !d.hidden; $('#demoFab').setAttribute('aria-expanded', String(!d.hidden)); renderDemo(); });
}

/* ---------- boot ---------- */
// LIVE mode (login-live.js) decides first whether the real API is reachable; without it the demo runs as before.
(window.YojoLiveReady || Promise.resolve(false)).then(function boot(live) {
  const q = new URLSearchParams(location.search);
  if (live && window.YojoLiveBoot()) return;
  if (q.get('role') === 'employee') { S.role = 'employee'; S.staff = q.get('as') === 'admin' ? 'admin' : 'trainer'; }
  if (session) { S.booting = true; land(); S.booting = false; return; }
  selectRole(S.role, S.staff);
  if (q.get('mode') === 'signup' && S.role === 'student') { S.ctx.gate = 'no'; viewSignup(); }
  const msg = q.get('msg'); if (msg) $('#flow').insertAdjacentHTML('afterbegin', alertBox('info', esc(msg)));
});

// test hooks (demo only)
if (CFG.DEMO) window.YojoDemo = { get db() { return db; }, mailbox, totp, OTP, advance(ms) { clockOffset += ms; }, reset() { db = seed(); save(); mailbox.length = 0; session = null; store.sset(SESSION_KEY, null); } };
</script>
<div class="ycur hide" id="ycur" aria-hidden="true" hidden><div class="ret"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" stroke-dasharray="18 4"/><path d="M20 0v8M20 32v8M0 20h8M32 20h8"/></svg></div><div class="dot"></div><div class="lbl">LOCK</div></div>
<script>
/* same cursor as the public page (also when this page is the login / sign-up popup) */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !matchMedia('(pointer:fine)').matches) return;
  const c = document.getElementById('ycur'), dot = c.querySelector('.dot'), ret = c.querySelector('.ret'), lbl = c.querySelector('.lbl'); c.hidden = false; document.documentElement.classList.add('cur-on');
  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
  addEventListener('pointermove', e => { x = e.clientX; y = e.clientY; dot.style.transform = `translate(${x}px,${y}px)`; lbl.style.transform = `translate(${x}px,${y}px)`; c.classList.remove('hide');
    const t = e.target.closest('a,button,[role=button],label[for],select,summary'); c.classList.toggle('lock', !!t); lbl.textContent = t ? 'LOCK' : ''; });
  addEventListener('pointerdown', () => c.classList.add('down')); addEventListener('pointerup', () => c.classList.remove('down'));
  document.addEventListener('pointerleave', () => c.classList.add('hide'));
  (function loop() { rx += (x - rx) * .2; ry += (y - ry) * .2; ret.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
})();
</script>

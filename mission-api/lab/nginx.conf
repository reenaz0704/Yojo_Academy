pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
  access_log off; error_log /dev/stderr warn;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { return 200 "ok\n"; }
    location / { add_header X-Content-Type-Options nosniff; add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'"; try_files $uri /index.html; }
  }
}

pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/c; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
  access_log off; error_log /dev/stderr warn; server_tokens off;
  limit_req_zone $binary_remote_addr zone=lab:1m rate=20r/s;
  map $http_host $lab_host { "~^(?<h>[A-Za-z0-9.:\-]{1,60})$" $h; default 127.0.0.1; }
  server {
    listen 8080;
    root /tmp/www;
    limit_req zone=lab burst=40 nodelay;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { return 200 "ok\n"; }
    location = /contact { return 303 /thanks.html; }
    location = /tools/subfinder.sh { default_type text/plain; sub_filter_types text/plain; sub_filter '__LAB__' 'http://$lab_host'; sub_filter_once off; }
    location /feed/ { default_type text/plain; }
    location / { try_files $uri $uri.html $uri/ =404; }
  }
}
